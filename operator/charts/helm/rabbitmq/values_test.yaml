DEPLOY_W_HELM: "true"
operatorImage: artifactorycn.netcracker.com:17152/netcracker/qubership-rabbitmq-operator:main
global:
  cloudIntegrationEnabled: false
  podReadinessTimeout: 540
allowEvents: false
name: rabbitmq-service
loglevel: DEBUG
rabbitmqPrometheusMonitoring: true
operator:
  restartScheduler:
    dockerImage: artifactorycn.netcracker.com:17152/netcracker/qubership-docker-kubectl:main
  resources:
    requests:
      cpu: 120m
      memory: 120Mi
    limits:
      cpu: 120m
      memory: 120Mi
rabbitmq:
  dockerImage: artifactorycn.netcracker.com:17152/netcracker/qubership-rabbitmq-image:main
  dockerImage3: artifactorycn.netcracker.com:17152/netcracker/qubership-rabbitmq-image-3:main
  securityContext:
    runAsUser: 5000
    fsGroup: 5000
  replicas: 3
  hostpath_configuration: false
  validate_state: true
  clean_rabbitmq_pvs: false
  auto_reboot: true
  setDefaultQueueTypeClassic: true
  nodePortService:
    install: true
  ingress:
    enabled: true
    host: fibu0125-rabbitmq-service.ci-master.openshift.sdntest.netcracker.com
  custom_params:
    rabbitmq_vm_memory_high_watermark: 80%
    rabbitmq_default_user: admin
    rabbitmq_default_password: admin
  customConfigProperties:
    - raft.adaptive_failure_detector.poll_interval = 2500
    - raft.wal_max_size_bytes = 32000000
  customAdvancedProperties:
    - "{kernel, [{net_ticktime, 120}]}"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
    storageclass: local-path
  storage: 5Gi
  enabledPlugins:
    - rabbitmq_prometheus
  perQueueMetrics: true
backupDaemon:
  image: artifactorycn.netcracker.com:17152/netcracker/qubership-rabbitmq-backup-daemon:main
  enabled: true
  backupSchedule: "*/5 * * * *"
  evictionPolicy: 1/10min,10min/delete
  storage: 1Gi
  storageClass: csi-cinder-sc-delete
  securityContext:
    runAsUser: 5000
    fsGroup: 5000
  s3:
    enabled: true
    url: https://infra-platform.s3.netcracker.com
    bucket: rabbitmq-qa
    keyId: plat-rw
    keySecret: Netcracker123
    sslCert: 
tests:
  dockerImage: artifactorycn.netcracker.com:17152/netcracker/qubership-rabbitmq-integration-tests:main
  runTests: true
  runTestsOnly: false
  runAsUser: 5000
  timeout: 1200
  waitTestResultOnJob: true
  rabbitmq_port: 15672
  amqp_port: 5672
  tags: backup
disasterRecovery:
  image: artifactorycn.netcracker.com:17152/netcracker/qubership-disaster-recovery-daemon:main
telegraf:
  dockerImage: artifactorycn.netcracker.com:17152/netcracker/qubership-rabbitmq-monitoring:main
statusProvisioner:
  dockerImage: artifactorycn.netcracker.com:17152/netcracker/qubership-deployment-status-provisioner:main
ESCAPE_SEQUENCE: "true"
