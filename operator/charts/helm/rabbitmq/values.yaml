##  rabbitmq params
rabbitmq:
  tls:
    enabled: true
    certificates:
      crt: ""
      key: ""
      ca: ""
    secretName: ""
    cipherSuites: []
    subjectAlternativeName:
      additionalDnsNames: []
      additionalIpAddresses: []
  eventLogging: true
  auto_reboot: false
  hostpath_configuration: false
  # Leave empty to keep the helper-driven default: autoheal when replicas < 3, otherwise pause_minority.
  cluster_partition_handling: ""
  ipv6_enabled: false
  ldap:
    enabled: false
    enableSsl: false
    advancedConfig: "{rabbitmq_auth_backend_ldap, [{tag_queries, [{administrator, {constant, false}}, {management, {constant, true}}]}]}"
  queueMigration:
    enabled: false
    snapshotMode: tar
  custom_params:
    rabbitmq_cluster_name: rabbitmq
    rabbitmq_vm_memory_high_watermark: 80%
#    rabbitmq_default_user: admin
#    rabbitmq_default_password: admin
#  volumes:
#    - rabbitmq-1
#    - rabbitmq-2
#    - rabbitmq-3
#  nodes:
#    - paas-infra311-master-1
#    - paas-infra311-master-2
#    - paas-infra311-master-3
  replicas: 3
  dockerImage: ghcr.io/netcracker/qubership-rabbitmq-image:main@sha256:7dc4aa532f260dc5d6d21cad0ca899a4d4f07ff3d29e8ef87e148f5f0701daa2
  dockerImage3: ghcr.io/netcracker/qubership-rabbitmq-image-3:main
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 1
      memory: 2Gi
    storage: 1024Mi
#    storageclass: "''"
  ingress:
    enabled: false
    host: ""
    className: ""
  
  envoyGateway:
    enabled: true
    host: ""
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: default-external-gateway
        namespace: gateway-system
 
  # The list of enabled plugins. For example,
  # enabledPlugins:
  #   - rabbitmq_shovel
  #   - rabbitmq_federation
  enabledPlugins: []
  # Custom configuration properties for RabbitMQ (rabbitmq.conf). For example,
  # customConfigProperties:
  #   - log.file = true
  #   - queue_master_locator = client-local
  customConfigProperties: []
  # Custom advanced configuration properties for RabbitMQ (advanced.config) in multi-line format. For example,
  # customAdvancedProperties:
  #   - |-
  #     {lager,
  #          [{handlers,
  #              [{lager_console_backend,
  #                  [{formatter_config,["[",date," ",time,"]",color,"[",severity,"] ",
  #                          {pid,[]},
  #                          " ",message,"\\n"]},
  #                      {level,info}]}]}]
  #          }
  #   - |-
  #     {rabbit,
  #              [{log,
  #                  [{file, [{file, false}]}] %% Disable RabbitMQ file handler
  #              }]}
  customAdvancedProperties: []
  # Additional environment variables to be specified in RabbitMQ. For example,
  # environmentVariables:
  #   - RABBITMQ_PROPERTY_NAME=propertyValue
  environmentVariables: []
  customLabels: {}
  customAnnotations: {}
  # When true (default), adds default_queue_type = classic to rabbitmq.conf and enables the operator's
  # nightly remediation timer that sets classic as the explicit type on any vhost/queue where it is
  # missing or stored as the string "undefined". Set to false only if this cluster intentionally uses
  # quorum or stream queues as the default type.
  setDefaultQueueTypeClassic: true
  affinity: {
    "podAntiAffinity": {
      "requiredDuringSchedulingIgnoredDuringExecution": [
        {
          "labelSelector": {
            "matchExpressions": [
              {
                "key": "app",
                "operator": "In",
                "values": [
                  "rmqlocal"
                ]
              }
            ]
          },
          "topologyKey": "topology.kubernetes.io/hostname"
        }
      ]
    }
  }
  selectors: {}
  securityContext: {}
  priorityClassName: ""
  disruptionBudget:
    enabled: false
  livenessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 15
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 30
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 15
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 90
  deleteStatefulSetOnForbiddenUpdate: true

tests:
  runTests: false
  dockerImage: ghcr.io/netcracker/qubership-rabbitmq-integration-tests:main@sha256:7e9d574383b38276c5dbca91a4671b412160fc1e6d98c32aba58de0b6bd04974
  statusWritingEnabled: true
  isShortStatusMessage: true
  runTestsOnly: false
  timeout: 1800
  requestTimeout: 60
  tags: smoke
  waitTestResultOnJob: false
  rabbitIsManagedByOperator: true
  rabbitmq_port: 15672
  amqp_port: 5672
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 256Mi
      cpu: 200m
  customLabels: {}
  securityContext: {}
  priorityClassName: ""
  affinity: {}
  prometheusUrl: ""
  # S3/ATP for test results (credentials under tests.atpReport.atpStorage)
  atpReport:
    enabled: false
    atpStorage:
      provider: "aws"
      serverUrl: "https://s3.amazonaws.com"
      serverUiUrl: ""
      bucket: ""
      region: "us-east-1"
      username: ""
      password: ""
  atpReportViewUiUrl: ""
  environmentName: "rabbitmq"
  monitoredImages: ""


# Backup Daemon is a service to manage RabbitMQ snapshots.
backupDaemon:
  cloudBackuper:
    enableAnnotations: true
  tls:
    enabled: true
    certificates:
      crt: ""
      key: ""
      ca: ""
    secretName: ""
    subjectAlternativeName:
      additionalDnsNames: []
      additionalIpAddresses: []
  # Enable Rabbitmq Backup Daemon installation.
  enabled: false
  image: ghcr.io/netcracker/qubership-rabbitmq-backup-daemon:main@sha256:8cc8883e706559facee29676e8a1c3e455c147666c8827217b3c15a2f1f571e8

  # storage and storageClass are the settings for configuring stateful
  # storage for the server pods. storage should be set to the disk size of
  # the attached volume. storageClass is the class of storage which defaults
  # to null (the Kube cluster will pick the default).
  # If storageClass and persistentVolume are not specified the RabbitMQ Backup Daemon is deployed with emptyDir.
  storage: 1Gi
  storageClass: "null"

  # The predefined Persistent Volume for the RabbitMQ Backup Daemon.
  persistentVolume: "null"

  # Specifies the cron-like backup schedule. If this parameter is empty,
  # the default schedule "0 0 * * *" is used.
  # The value `0 0 * * *` means that snapshots are created every day at midnight.
  backupSchedule: "0 0 * * *"

  #  Specifies the backup eviction policy. It is a comma-separated string of policies
  #  written as `$start_time/$interval`. This policy splits all backups older than `$start_time` to numerous time intervals
  #  `$interval` time long. Then it deletes all backups in every interval except the newest one. For example, `1d/7d` policy
  #  means "take all backups older then one day, split them in groups by 7-days interval, and leave only the newest."
  # If this parameter is empty, the default eviction policy "0/1d,7d/delete" is used.
  evictionPolicy: "0/1d,7d/delete"

  # Resource requests, limits, etc. for the server cluster placement. This
  # should map directly to the value of the resources field for a PodSpec,
  # formatted as a YAML string.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

  # Affinity Settings for Backup Daemon pod, formatted as a JSON string.
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  # Example:
  # affinity: {
  #   "nodeAffinity": {
  #     "requiredDuringSchedulingIgnoredDuringExecution": {
  #       "nodeSelectorTerms": [
  #         {
  #           "matchExpressions": [
  #             {
  #               "key": "node-role.kubernetes.io/master",
  #               "operator": "DoesNotExist"
  #             }
  #           ]
  #         }
  #       ]
  #     }
  #   }
  # }
  affinity: {}

  # Toleration Settings for Backup Daemon pod
  # This should be a JSON string matching the Toleration array
  # in a PodSpec.
  # Example:
  # tolerations: [
  #   {
  #     "operator": "Exists"
  #   }
  # ]
  tolerations: []

  # nodeSelector labels for syncCatalog pod assignment, formatted as a JSON string.
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
  # Example:
  # nodeSelector: {
  #   "beta.kubernetes.io/arch": "amd64"
  # }
  nodeSelector: {}

  # used to assign priority to backup daemon pod
  # ref: https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/
  priorityClassName: ""

  s3:
    enabled: false
    sslVerify: true
    sslSecretName: ""
    sslCert: ""
    url: ""
    bucket: ""
    keyId: ""
    keySecret: ""
  s3Aliases: []
  # - name: default
  #   spec:
  #     default: true
  #     storageBucket: backup-restore-bucket
  #     storageProvider: aws
  #     storageRegion: us-east-1
  #     storageServerUrl: "https://s3.example.com"
  #     storageUsername: name
  #     storageSecret: storage-location-default
  #   secretContent:
  #     storagePassword: pass

  customLabels: {}

  # Security context for backup daemon. For example
  # securityContext:
  #   runAsUser: 5000
  securityContext: {}

